[project]
name = "ymg-backend"
version = "0.1.0"
description = "YouTube 音楽投稿自動化システム — backend (FastAPI)"
requires-python = ">=3.13"
dependencies = [
    # --- Web / ASGI ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.1.3",
    "python-multipart>=0.0.12",
    # --- DB (SQLAlchemy 2.x async + Alembic + pgvector) ---
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.3",
    "pgvector>=0.3.6",
    # --- 設定 / バリデーション (Pydantic v2) ---
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.0",
    # --- スケジューラ / ログ / ストレージ抽象 ---
    "apscheduler>=3.10.4",
    "loguru>=0.7.2",
    "fsspec>=2024.9.0",
    "s3fs>=2024.9.0",
    # --- コンプラ / 暗号 ---
    "pyacoustid>=1.3.0",
    "cryptography>=43.0.1",
    # --- 画像 (サムネオーバーレイ) / テンプレ ---
    "pillow>=10.4.0",
    "pyyaml>=6.0.2",
    # --- 外部 API ---
    "google-api-python-client>=2.147.0",
    "google-auth>=2.35.0",
    "google-auth-oauthlib>=1.2.1",
    "slack-sdk>=3.33.1",
    "httpx>=0.27.2",
    # --- LLM SDK (ADR-0019) ---
    "anthropic>=0.39.0",
    "openai>=1.51.0",
    "ollama>=0.3.3",
]

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.1",
    "factory-boy>=3.3.1",
    "freezegun>=1.5.1",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ymg_backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "critical: critical path tests (100% coverage required, Constitution II)",
]
