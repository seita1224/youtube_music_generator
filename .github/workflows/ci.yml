name: CI

on:
  push:
    branches: [main, 001-youtube-music-generator]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      gpu_worker: ${{ steps.filter.outputs.gpu_worker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            gpu_worker:
              - 'gpu_worker/**'

  backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ymg
          POSTGRES_USER: ymg
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ymg" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ymg
      POSTGRES_USER: ymg
      POSTGRES_PASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.13"
      - name: Install deps
        working-directory: backend
        run: uv sync
      - name: Ruff
        working-directory: backend
        run: uv run ruff check .
      - name: Mypy
        working-directory: backend
        run: uv run mypy src
      - name: Pytest
        working-directory: backend
        # 「テスト未収集 (exit 5)」は Phase 1 では成功扱い
        run: |
          set +e
          uv run pytest -q
          code=$?
          if [ "$code" -eq 5 ]; then echo "no tests collected yet"; exit 0; fi
          exit $code

  frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci || npm install
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Unit tests
        working-directory: frontend
        run: npm run test

  gpu_worker:
    needs: changes
    if: ${{ needs.changes.outputs.gpu_worker == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # GPU 不要、 イメージが build できることだけ確認 (ADR-0031, T124)
      - name: Docker build (gpu_worker)
        run: docker build -t ymg-gpu-worker:ci ./gpu_worker
