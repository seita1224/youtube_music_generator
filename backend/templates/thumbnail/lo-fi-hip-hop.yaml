# Thumbnail template — lo-fi hip-hop (ADR-0034 §(3)).
# Genre-specific font / palette overrides for the Pillow overlay. Shared
# geometry lives in _shared/layout.json and _shared/badge.json.
# This file is the reference defaults; other genres override only what differs.
version: 1
genre: "lo-fi hip-hop"        # canonical genres.name (data-model.md)
font_primary: "Bebas Neue"    # genre display font (subtext, badge, duration)
font_secondary: "Noto Sans JP" # Japanese headline font (all genres)
color_text: "#FFFFFF"
color_outline: "#000000"
outline_width: 4
text_position: "center-bottom"
genre_badge_color: "#1A1A1A"
