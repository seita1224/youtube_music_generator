name: secrets-scan

# gitleaks で .env 系シークレット (API キー / パスワード / トークン / FERNET_KEY 等) の
# 混入を検査する (T141)。 前提:
#   - 値入りの `.env` は .gitignore 済でコミットされない
#   - 値抜きの `.env.example` のみコミット (プレースホルダ __set_strong_value__ 等)
# この workflow は「値抜き example はそのまま通し、 本物のシークレットだけ落とす」ことを保証する。

on:
  push:
    branches: [main, 001-youtube-music-generator]
  pull_request:

concurrency:
  group: secrets-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # PR 差分だけでなく履歴全体を走査するため full clone する。
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # OSS / public でも使えるよう license は任意。 secret は不要 (gitleaks 本体は無料)。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
