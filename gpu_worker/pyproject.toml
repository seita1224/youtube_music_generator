[project]
name = "ymg-gpu-worker"
version = "0.1.0"
description = "YouTube 音楽投稿自動化システム — GPU worker (ACE-Step + SDXL)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.2",
    "httpx>=0.27.2",
    "fsspec>=2024.9.0",
    "pillow>=10.4.0",
    # --- 推論ランタイム ---
    "torch>=2.5.0",
    "diffusers>=0.31.0",
    "transformers>=4.45.0",
    "accelerate>=1.0.0",
    "safetensors>=0.4.5",
    # 任意: GPU 側でも指紋を取りたい場合
    "pyacoustid>=1.3.0",
]
# 注: ACE-Step 1.5 は PyPI 配布が安定しないため pip 依存に固定しない。
# Dockerfile / セットアップ手順で HF or GitHub から取得する (ADR-0031, quickstart §5)。

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "pytest>=8.3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ymg_gpu_worker"]

# torch は CUDA 12.4 ホイールを使う (ADR-0031)
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
