# Title template for the "piano solo" genre (ADR-0034).
#
# Directive syntax (ADR-0017):
#   - {{<ascii identifier>}} -> system variable substitution (e.g. {{duration}}, {{genre}})
#   - {{<free-form Japanese instruction>}} -> LLM-generated text
#
# Title policy (ADR-0034 section 1):
#   "{English genre name} {duration}min | {<=12-char Japanese subtitle}"
genre: "piano solo"
display_name: "Piano Solo"
template: "Piano Solo {{duration}}min | {{12字以内の日本語サブタイトル}}"
example: "Piano Solo 30min | 深夜の独白"
